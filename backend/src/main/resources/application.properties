# Server
server.port=8080

# PostgreSQL — supports Docker env-var overrides
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ganesha_ayurvedaa}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ganesha_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ganesha123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.data.jpa.repositories.bootstrap-mode=default

# JWT
app.jwt.secret=${APP_JWT_SECRET:GaneshaAyurvedaaSecretKey2024SuperLongKeyForHS256AlgorithmSecurity}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

# Actuator (for Docker health check)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Jackson — treat empty strings as null (fixes empty enum fields from frontend forms)
spring.jackson.deserialization.ACCEPT_EMPTY_STRING_AS_NULL_OBJECT=true

# Logging
logging.level.com.ganesha=INFO
logging.level.org.springframework.security=WARN
