server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================================
    # Patient Service - 8101
    # ==========================================================
    location /api/v1/patients {
        proxy_pass http://host.docker.internal:8101;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # Doctor Service - 8102
    # ==========================================================
    location /api/v1/doctors {
        proxy_pass http://host.docker.internal:8102;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # Appointment Service - 8103
    # ==========================================================
    location ~ ^/api/v1/(appointments|appointment-therapies|treatment-categories|treatment-plans|treatment-plan-masters|consultation-types|therapies|doshas|systemic-examinations|physical-examinations|medical-histories|medical-assessment|lifestyle-information|ayurvedic-assessments|dashboard/todays-schedule|dashboard/patient-trends|treatments|follow-ups|prescriptions) {
        proxy_pass http://host.docker.internal:8103;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # Dashboard new patients - Patient Service
    # ==========================================================
    location /api/v1/dashboard/new-patients-by-month {
        proxy_pass http://host.docker.internal:8101;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # Therapist Service - 8104
    # ==========================================================
    location /api/v1/therapists {
        proxy_pass http://host.docker.internal:8104;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # File Upload Service - 8105
    # ==========================================================
    location /api/v1/documents {
        proxy_pass http://host.docker.internal:8105;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50M;
    }

    # ==========================================================
    # Attendance Service - 8106
    # ==========================================================
    location /api/v1/attendances {
        proxy_pass http://host.docker.internal:8106;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # Activity Log Service - 8107
    # ==========================================================
    location /api/v1/activity-logs {
        proxy_pass http://host.docker.internal:8107;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # Medicine Service - 8108
    # ==========================================================
    location ~ ^/api/v1/(medicines|dashboard/medicine-stock) {
        proxy_pass http://host.docker.internal:8108;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # Billing Service - 8109
    # ==========================================================
    location ~ ^/api/v1/(billings|billing|invoices|sales|dashboard/billing-summary|packages|package-masters) {
        proxy_pass http://host.docker.internal:8109;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # Notification Service - 8110
    # ==========================================================
    location ~ ^/api/v1/(notifications|messages) {
        proxy_pass http://host.docker.internal:8110;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # Auth Service - 8111
    # ==========================================================
    location ~ ^/api/v1/(auth|public|tenants|ui-pages|roles|platform) {
        proxy_pass http://host.docker.internal:8111;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # Payment Service - 8112
    # ==========================================================
    location /api/v1/payments {
        proxy_pass http://host.docker.internal:8112;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pay {
        proxy_pass http://host.docker.internal:8112;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # React SPA
    # IMPORTANT for BrowserRouter
    # ==========================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================================
    # Static assets
    # ==========================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
