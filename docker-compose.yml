version: '3.9'

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ganesha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ganesha_ayurvedaa
      POSTGRES_USER: ganesha_user
      POSTGRES_PASSWORD: ganesha123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganesha_user -d ganesha_ayurvedaa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ganesha_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ganesha_ayurvedaa
      SPRING_DATASOURCE_USERNAME: ganesha_user
      SPRING_DATASOURCE_PASSWORD: ganesha123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: GaneshaAyurvedaaSecretKey2024SuperLongKeyForHS256AlgorithmSecurity
      APP_JWT_EXPIRATION: 86400000
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://frontend
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── React Frontend (Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ganesha_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: ganesha_network
